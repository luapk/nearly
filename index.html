<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nearly: a word map for copywriters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#ffffff; --ink:#000000; --mid:#6b6b6b; --rule:#cfcfcf; --faint:#eeeeee; --ghost:#b8b8b8;
  --f:"Helvetica Neue",Helvetica,"Inter Tight",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--paper:#000000;--ink:#ffffff;--mid:#a3a3a3;--rule:#3d3d3d;--faint:#1a1a1a;--ghost:#5c5c5c;color-scheme:dark}
}
:root[data-theme="dark"]{--paper:#000000;--ink:#ffffff;--mid:#a3a3a3;--rule:#3d3d3d;--faint:#1a1a1a;--ghost:#5c5c5c;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
b,strong{font-weight:700}

/* Masthead */
.top{padding:18px 24px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:3px solid var(--ink);padding-bottom:8px}
.mark{font-weight:700;font-size:30px;letter-spacing:-.05em;line-height:1}
.thesis{font-size:14px;color:var(--mid);text-align:right}
.fld{display:flex;flex-direction:column;padding:4px 0 2px;border-bottom:1px solid var(--rule);min-width:220px;flex:1 1 220px}
.fld span{font-size:12px;color:var(--mid)}
.fld input{border:0;background:transparent;font-size:17px;padding:3px 0 2px;outline:none;width:100%;min-width:0}
.fld input::placeholder{color:var(--mid);opacity:.7}
.fld:focus-within span{color:var(--ink)}
.go{background:var(--ink);color:var(--paper);border:0;font-weight:700;font-size:16px;padding:0 28px;cursor:pointer;min-height:48px}
.go:active{opacity:.8}
.busybar{height:3px;background:transparent;overflow:hidden;position:relative}
body.busy .busybar::after{content:"";position:absolute;top:0;bottom:0;width:30%;background:var(--ink);animation:slide 1.1s linear infinite}
@keyframes slide{from{left:-30%}to{left:100%}}
body.pending .ctl,body.pending .field,body.pending .caption,body.pending .tray{opacity:.3;pointer-events:none}

/* Stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:0 32px;padding:0 24px 40px}
.primary{min-width:0}

/* Hero: the line, or the word */
.hero{padding:22px 0 14px}
.heroline,.heroedit{font-size:var(--hs,120px);font-weight:700;letter-spacing:-.04em;line-height:1.08;margin:0}
.heroline{overflow-wrap:anywhere}
.heroedit{display:block;width:100%;border:0;border-bottom:3px solid var(--ink);background:transparent;resize:none;overflow:hidden;font-family:inherit;padding:0 0 .06em;outline:none;color:var(--ink);caret-color:var(--ink)}
.heroedit::placeholder{color:var(--ghost);opacity:1}
.herolabel{display:block;font-size:17px;font-weight:700;margin:0 0 10px}
.heroedit:focus{outline:none}
.heroword{background:none;border:0;padding:0;margin:0;font:inherit;letter-spacing:inherit;color:inherit;cursor:text;text-align:left;overflow-wrap:anywhere}
.heroword:hover{text-decoration:underline;text-decoration-style:dotted;text-decoration-thickness:.035em;text-underline-offset:.1em;text-decoration-color:var(--rule)}
.actionrow{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;padding:16px 0 2px}
.actionrow .hint{font-size:13px;color:var(--mid);padding-bottom:6px}
body.blank .go{font-size:19px;padding:0 40px;min-height:56px}
body.blank .ctl,body.blank .field,body.blank .caption{display:none}
.steps{margin:0;padding:0 0 0 1.2em;font-size:15px}
.steps li{padding:6px 0;border-top:1px solid var(--faint)}
.steps li:first-child{border-top:0}
.heroline .tok{background:none;border:0;padding:0;margin:0;font:inherit;letter-spacing:inherit;cursor:pointer;color:inherit}
.heroline .tok:hover{text-decoration:underline;text-decoration-thickness:.05em;text-underline-offset:.08em;text-decoration-color:var(--rule)}
.heroline .cur,.heroline .cur:hover{text-decoration:underline;text-decoration-thickness:.075em;text-underline-offset:.08em;text-decoration-color:var(--ink);cursor:default}
.heroline .in{background:var(--ink);color:var(--paper);padding:0 .08em}
.heroprompt .tok:hover{background:var(--ink);color:var(--paper);text-decoration:none}
.swapbar{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px;padding-top:14px;font-size:14px}
.swapbar b{font-size:15px}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:700;font-size:inherit}
.copy{background:none;border:1px solid var(--ink);font-size:12px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);margin-top:14px;font-size:14px}
.meta>span{padding:7px 14px 7px 0;margin-right:14px;border-right:1px solid var(--rule);display:inline-flex;align-items:center;gap:7px;min-height:36px}
.meta>span:last-child{border-right:0}
.meta small{color:var(--mid);font-size:12px}
.status{font-size:14px;margin:10px 0 0;min-height:1.4em;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}

/* Beat glyph */
.beat{display:inline-flex;gap:3px;align-items:flex-end;vertical-align:middle}
.beat i{display:block;width:9px;height:9px;border:1.5px solid var(--ink)}
.beat i.p{background:var(--ink);height:16px}
.beat i.s{background:var(--mid);border-color:var(--mid);height:12px}

/* Lens row */
.ctl{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:14px 0 10px}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grp>small{font-size:12px;color:var(--mid);margin-right:4px}
.chip{border:1px solid var(--ink);background:none;font-size:13px;padding:5px 10px;cursor:pointer;line-height:1.2}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lensgrp{flex-basis:100%}
.lensbtn{border:1px solid var(--ink);background:none;padding:6px 12px 7px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:1px;line-height:1.2}
.lensbtn b{font-size:14px}
.lensbtn span{font-size:12px;color:var(--mid)}
.lensbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lensbtn[aria-pressed="true"] span{color:inherit;opacity:.75}
.lensread{flex-basis:100%;margin:0;font-size:14px;max-width:72ch}

/* Field */
.field{position:relative}
.field svg{display:block;width:100%;height:auto;overflow:visible;font-family:var(--f)}
.grid line{stroke:var(--faint);stroke-width:1}
.axis{stroke:var(--rule);stroke-width:1}
.frame{fill:none;stroke:var(--ink);stroke-width:1}
.axlab{fill:var(--ink);font-size:12px;font-weight:700}
.axname{fill:var(--mid);font-size:12px}
.corner{fill:var(--mid);font-size:11px}
.corner.best{fill:var(--ink);font-size:12px;font-weight:700}
.dot{fill:var(--ink)}
.dot.ghost{opacity:.18}
.leader{stroke:var(--mid);stroke-width:.75}
.lab{cursor:pointer;outline:none}
.lab text{fill:var(--ink)}
.lab .hl{fill:var(--ink);opacity:0}
.lab .ring{fill:none;stroke:var(--ink);stroke-width:1.5;opacity:0}
.lab:hover text{text-decoration:underline}
.lab.sel .hl{opacity:1}
.lab.sel text{fill:var(--paper);text-decoration:none}
.lab.pin text{text-decoration:underline;text-decoration-thickness:2px}
.lab.focus .ring{opacity:1}
.lab .bt{fill:none;stroke:var(--ink);stroke-width:1.5}
.lab .bt.p{fill:var(--ink)}
.lab.sel .bt{stroke:var(--paper)}
.lab.sel .bt.p{fill:var(--paper)}
.src line,.src circle{stroke:var(--ink);stroke-width:1.25;fill:none}
.src .srcline{stroke-dasharray:3 3}
.src text{fill:var(--ink);font-weight:700;font-size:13px}
.src text tspan{font-weight:400;fill:var(--mid)}
.fieldmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--mid);pointer-events:none;text-align:center;padding:24px}
.caption{font-size:15px;min-height:3.2em;padding:10px 0 0;border-top:1px solid var(--ink);margin:6px 0 0}
.caption b{margin-right:8px}
.caption span{color:var(--mid)}

/* Shortlist */
.tray{display:none;flex-wrap:wrap;align-items:center;gap:8px 10px;border-top:3px solid var(--ink);margin-top:18px;padding:12px 0 0}
.tray.on{display:flex}
.tray>small{font-size:12px;color:var(--mid);margin-right:6px}
.pill{display:inline-flex;align-items:stretch;border:1px solid var(--ink)}
.pill .pw{background:none;border:0;padding:5px 8px 5px 10px;font-size:14px;font-weight:700;cursor:pointer}
.pill .pw:hover{text-decoration:underline}
.pill .px{background:none;border:0;border-left:1px solid var(--rule);padding:0 8px;cursor:pointer;font-size:13px;color:var(--mid)}
.pill .px:hover{background:var(--ink);color:var(--paper)}
.tray .copy{margin-left:auto}

/* Detail panel */
.detail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:100vh;overflow:auto;border-left:1px solid var(--ink);padding:16px 0 28px 24px}
.dclose{display:none}
.d-empty{font-size:16px;color:var(--mid);margin:4px 0 18px;max-width:30ch}
.dw{font-size:52px;font-weight:700;letter-spacing:-.05em;line-height:.9;margin:0 0 8px;overflow-wrap:anywhere}
.dmeta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px;color:var(--mid);padding-bottom:12px;border-bottom:1px solid var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:6px;padding:12px 0}
.act{border:1px solid var(--ink);background:none;font-size:13px;padding:6px 10px;cursor:pointer}
.act.primary{background:var(--ink);color:var(--paper);font-weight:700}
.dsec{padding:12px 0;border-top:1px solid var(--rule)}
.dsec>small{display:block;font-size:12px;color:var(--mid);margin-bottom:4px}
.dsec p{margin:0;font-size:15px;max-width:40ch}
.dnote{font-size:18px;line-height:1.3;letter-spacing:-.01em}
.prow{display:grid;grid-template-columns:82px 44px minmax(0,1fr) 52px;gap:8px;align-items:center;font-size:12px;padding:3px 0}
.prow .plab{font-weight:700}
.prow .lo{color:var(--mid);text-align:right}
.prow .hi{color:var(--mid)}
.scale{position:relative;height:16px}
.scale::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--rule)}
.scale::after{content:"";position:absolute;left:50%;top:3px;bottom:3px;border-left:1px solid var(--rule)}
.scale .pt,.scale .tick{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;z-index:1}
.scale .pt{background:var(--ink)}
.scale .tick{border:1.5px solid var(--ink);background:var(--paper)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mid);margin-top:6px;align-items:center}
.legend i{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px}
.legend .a{background:var(--ink)}
.legend .b{border:1.5px solid var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{border:1px solid var(--rule);padding:3px 8px;font-size:13px;background:none}
button.tag{cursor:pointer;border-color:var(--ink)}
button.tag:hover{background:var(--ink);color:var(--paper)}
.dwait{color:var(--mid);font-size:14px}
.senselist{margin:0;padding:0;list-style:none}
.senselist li{padding:6px 0;border-top:1px solid var(--faint);font-size:15px}

/* Path */
.trail{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;padding:14px 0 0;border-top:1px solid var(--ink);margin-top:30px;font-size:14px}
.trail small{color:var(--mid);font-size:12px}
.trail button{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.trail button[aria-current="true"]{font-weight:700;text-decoration:none}
.trail sup{font-size:10px;color:var(--mid);margin-right:3px}
.empty{padding:28px 0;font-size:17px;max-width:46ch}

/* Narrow screens */
@media (max-width:899px){
  .top{padding:14px 16px 0}
  .brand{flex-direction:column;gap:4px}
  .thesis{font-size:13px;text-align:left}
  .actionrow{gap:12px}
  .actionrow .go{width:100%}
  .lensgrp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .lensgrp>small{grid-column:1/-1}
  .lensbtn{padding:6px 8px 7px}
  .stage{grid-template-columns:minmax(0,1fr);padding:0 16px 40px}
  .detail{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:78vh;border-left:0;border-top:3px solid var(--ink);background:var(--paper);padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);visibility:hidden;transition:transform .28s ease,visibility 0s linear .28s;z-index:20}
  body.sheet-open .detail{transform:none;visibility:visible;transition:transform .28s ease}
  .dclose{display:block;position:absolute;right:12px;top:10px;background:none;border:1px solid var(--ink);font-size:13px;padding:5px 10px;cursor:pointer}
  .dw{font-size:42px;padding-right:70px}
  .d-idle{display:none}
}
@media (prefers-reduced-motion: reduce){
  body.busy .busybar::after{animation:none;left:0;width:100%;opacity:.3}
  .detail{transition:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="mark">Nearly</span>
    <span class="thesis">No two words mean exactly the same thing.</span>
  </div>
  <div class="busybar" aria-hidden="true"></div>
</header>

<main class="stage">
  <section class="primary">
    <div class="hero" id="hero"></div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="ctl" id="ctl"></div>
    <div class="field" id="fieldwrap">
      <svg id="fieldsvg" role="group" aria-label="Alternatives plotted on two scales"></svg>
      <div class="fieldmsg" id="fieldmsg"></div>
    </div>
    <p class="caption" id="caption" aria-live="polite"></p>
    <div class="tray" id="tray" aria-label="Shortlist"></div>
    <footer class="trail" id="trail" aria-label="Your path"></footer>
  </section>
  <aside class="detail" id="detail" aria-label="Word detail"></aside>
</main>

<script>
(() => {
'use strict';

/* ---------- Dimensions and lenses ---------- */
const DIMS = {
  fresh:{label:'Freshness', lo:'Worn', hi:'Fresh'},
  fit:{label:'Fit', lo:'Weak fit', hi:'Strong fit'},
  reg:{label:'Formality', lo:'Plain', hi:'Formal'},
  temp:{label:'Temperature', lo:'Cool', hi:'Warm'},
  int:{label:'Intensity', lo:'Softer', hi:'Stronger'},
  conc:{label:'Texture', lo:'Abstract', hi:'Concrete'},
  syl:{label:'Length', lo:'Shorter', hi:'Longer'}
};
// Each lens is a pair of scales for the map. `read` is the one-line key shown above it;
// `corners` name the four corners in plain words, top-left, top-right, bottom-left, bottom-right.
const LENSES = {
  fit:{name:'Best fit', sub:'fit and freshness', x:'fresh', y:'fit', best:1,
    read:ln => `Higher means it fits ${ln} better. Further right means it\u2019s less worn out in advertising. Start in the top right.`,
    corners:['Fits, but worn', 'Fits and fresh', 'Poor fit, worn', 'Fresh, poor fit']},
  tone:{name:'Tone', sub:'formality and warmth', x:'reg', y:'temp',
    read:() => 'Right is more formal, left is plainer. Up is warmer, down is cooler. The cross is your word, so the further a word sits from it, the more it shifts the tone. Bigger words fit better.',
    corners:['Plain and warm', 'Formal and warm', 'Plain and cool', 'Formal and cool']},
  sound:{name:'Sound', sub:'fit and length', x:'syl', y:'fit', beats:true, best:0,
    read:ln => `Higher means it fits ${ln} better. Further right means more syllables. The blocks after each word are its rhythm: the tall block is the stressed beat.`,
    corners:['Fits, short', 'Fits, long', 'Poor fit, short', 'Poor fit, long']}
};
const PROFILE = ['reg','temp','int','conc','fresh'];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- Example map, so the page works before any lookup ---------- */
const SEED = {
  query:{word:'quiet', line:'The quiet confidence of a well-made thing.', intent:''},
  head:{w:'quiet', pos:'adjective', ipa:'ˈkwaɪət', stress:'10', reg:0, int:0, temp:10, conc:0, fresh:-10,
    senses:[{id:'s1',g:'Making little or no sound'},{id:'s2',g:'Calm and free from activity'},{id:'s3',g:'Understated, not showy'},{id:'s4',g:'Discreet or kept private'}],
    lineSense:'s3'},
  alts:[
    ['understated','s3','adjective','ˌʌndəˈsteɪtɪd','2010',30,-10,0,-40,-20,88,'Precise, but it explains the effect instead of letting it happen.'],
    ['unhurried','s2','adjective','ʌnˈhʌrid','010',30,0,30,0,60,82,'Adds time and craft. The most specific option for something well made.'],
    ['composed','s2','adjective','kəmˈpəʊzd','01',30,10,-10,-30,10,80,'Self-possessed and close to the intent, slightly formal.'],
    ['restrained','s3','adjective','rɪˈstreɪnd','01',40,20,-30,-30,0,78,'Implies power held back. More tension than quiet.'],
    ['measured','s3','adjective','ˈmeʒəd','10',40,10,-20,-30,10,76,'Deliberate and adult. Leans corporate if used often.'],
    ['patient','s2','adjective','ˈpeɪʃənt','10',0,0,40,-20,60,74,'Suggests the making took time. Unexpected, and it earns its place.'],
    ['unfussy','s3','adjective','ʌnˈfʌsi','010',-30,0,20,10,50,73,'Craft-shop language. Honest, a little homely.'],
    ['still','s2','adjective','stɪl','1',10,10,-20,10,40,72,'Adds weight and permanence. Can be misread as yet.'],
    ['calm','s2','adjective','kɑːm','1',-30,-10,20,0,0,70,'Warmer and more human. Moves from the object to a mood.'],
    ['unassuming','s3','adjective','ˌʌnəˈsjuːmɪŋ','2010',30,-20,30,-50,10,68,'Likeable, but long and a touch self-deprecating.'],
    ['discreet','s4','adjective','dɪˈskriːt','01',40,0,-10,-30,-10,66,'Borrowed from luxury and banking. Suggests secrecy.'],
    ['soft-spoken','s3','adjective','ˌsɒftˈspəʊkən','210',10,-30,50,30,50,64,'Gives the object a voice. Warm, slightly human.'],
    ['modest','s3','adjective','ˈmɒdɪst','10',0,-30,40,-20,-10,62,'Humble rather than assured. Undercuts the confidence.'],
    ['muted','s3','adjective','ˈmjuːtɪd','10',20,-10,-20,30,20,60,'Borrowed from colour. Reads as toned down, not self-possessed.'],
    ['plain','s3','adjective','pleɪn','1',-50,10,-10,30,30,58,'Blunt and honest. Risks sounding like a lack of design.'],
    ['hushed','s1','adjective','hʌʃt','1',20,20,0,40,40,55,'Theatrical. Suggests an audience holding its breath.'],
    ['reticent','s4','adjective','ˈretɪsənt','100',70,10,-40,-50,50,52,'Clever, but reads as reluctant. Some readers will misread it.'],
    ['low-key','s4','adjective','ˌləʊˈkiː','21',-60,-20,20,-20,-20,50,'Too casual for well-made. Sounds like a shrug.'],
    ['gentle','s2','adjective','ˈdʒentl','10',-20,-30,60,0,-20,48,'Warm but soft. Confidence wants a firmer word.'],
    ['silent','s1','adjective','ˈsaɪlənt','10',0,50,-40,20,-30,45,'Too absolute. Confidence that says nothing reads as cold.'],
    ['serene','s2','adjective','səˈriːn','01',50,10,10,-40,-40,40,'Spa vocabulary. Worn, and too spiritual for an object.'],
    ['noiseless','s1','adjective','ˈnɔɪzləs','10',20,30,-50,40,30,38,'Technical. Reads like a product spec for a dishwasher.'],
    ['peaceful','s2','adjective','ˈpiːsfl','10',-10,-10,40,-20,-40,35,'Pleasant and vague. Softens the line into nothing.'],
    ['tranquil','s2','adjective','ˈtræŋkwɪl','10',50,0,0,-20,-50,30,'Describes a lake, not a thing. Brochure language.']
  ].map(r => ({w:r[0], sense:r[1], pos:r[2], ipa:r[3], stress:r[4], reg:r[5], int:r[6], temp:r[7], conc:r[8], fresh:r[9], fit:r[10],
    ctx:`The ${r[0]} confidence of a well-made thing.`, note:r[11]}))
};

/* ---------- State ---------- */
const keyOf = (w, l, i) => [w, l, i].map(x => (x || '').trim().toLowerCase()).join('|');
const SEED_KEY = keyOf(SEED.query.word, SEED.query.line, SEED.query.intent);
const state = {
  query:{word:'', line:'', intent:''}, head:{}, alts:[],
  loading:false, lens:'fit', hidden:new Set(), selected:null, shortlist:[],
  trail:[], currentKey:null, pending:null, editing:true, draft:''
};
// Nothing is mapped until the writer types something; the worked example sits behind a link.
const isBlank = () => !state.head.w && !state.pending;
const cache = new Map([[SEED_KEY, {query:{...SEED.query}, head:{...SEED.head}, alts:SEED.alts.map(a => ({...a}))}]]);
const details = new Map();
const fieldPos = new Map();

/* ---------- Claude, however this page is being served ----------
   Inside Claude the page asks Claude directly. Served from Vercel it posts to

    if (hd.senses && hd.senses.length > 1) {
      const ul = h('ul', {class:'senselist'});
      hd.senses.forEach(se => ul.append(h('li', {}, se.g, se.id === hd.lineSense && lineOk() ? h('b', {}, '  (your line)') : null)));
      box.append(h('div', {class:'dsec'}, h('small', {}, `Senses of ${hd.w}`), ul));
    }
    $detail.append(box);
    return;
  }
  const hd = state.head;
  const listed = state.shortlist.some(p => p.w === a.w && p.of === hd.w);
  $detail.append(h('button', {type:'button', class:'dclose', onclick:deselect}, 'Close'));
  $detail.append(h('h2', {class:'dw'}, a.w));
  $detail.append(h('div', {class:'dmeta'},
    a.pos ? h('span', {}, a.pos) : null, a.ipa ? h('span', {}, `/${a.ipa}/`) : null,
    a.stress ? beat(a.stress) : null, h('span', {}, `${letters(a.w)} letters`), h('span', {}, `Fit ${a.fit}`)));
  const cp = h('button', {type:'button', class:'act'}, lineOk() && a.ctx ? 'Copy line' : 'Copy word');
  cp.addEventListener('click', () => copyText(lineOk() && a.ctx ? a.ctx : a.w, cp));
  $detail.append(h('div', {class:'acts'},
    h('button', {type:'button', class:'act primary', onclick:() => mapWord(a)}, `Map ${a.w}`),
    h('button', {type:'button', class:'act', 'aria-pressed':String(listed), onclick:() => toggleShortlist(a.w)}, listed ? 'Remove from shortlist' : 'Shortlist'),
    cp));
  if (a.note) $detail.append(h('div', {class:'dsec'}, h('p', {class:'dnote'}, a.note)));
  const prof = h('div', {class:'dsec'}, h('small', {}, `Against ${hd.w}`));
  PROFILE.forEach(d => prof.append(profRow(d, a[d], hd.senses ? hd[d] : null)));
  prof.append(h('div', {class:'legend'}, h('span', {}, h('i', {class:'a'}), a.w), h('span', {}, h('i', {class:'b'}), hd.w)));
  $detail.append(prof);

  const k = detailKey(a), d = details.get(k);
  if (!d || d.loading) { $detail.append(h('div', {class:'dsec'}, h('p', {class:'dwait'}, 'Loading meaning and cautions\u2026'))); return; }
  if (d.error) {
    const msg = d.error === 'unavailable' ? 'Meaning and cautions need a connection to Claude.' : (ERR[d.error] || 'Couldn\u2019t load meaning and cautions.');
    const box = h('div', {class:'dsec'}, h('p', {class:'dwait'}, msg + ' '));
    if (d.error !== 'unavailable' && d.error !== 'not_granted' && d.error !== 'sampling_disabled') box.firstChild.append(h('button', {type:'button', class:'linkbtn', onclick:() => { details.delete(k); loadDetail(a); renderDetail(); }}, 'Try again'));
    $detail.append(box); return;
  }
  const x = d.data || {};
  const str = v => (typeof v === 'string' ? v : '').trim();
  const arr = v => Array.isArray(v) ? v.map(y => String(y).trim()).filter(Boolean).slice(0, 8) : [];
  const sec = (label, body) => body ? $detail.append(h('div', {class:'dsec'}, h('small', {}, label), body)) : null;
  sec('Meaning', str(x.def) && h('p', {}, str(x.def)));
  sec('What it implies', str(x.conn) && h('p', {}, str(x.conn)));
  sec('Use it when', str(x.use) && h('p', {}, str(x.use)));
  sec('Avoid it when', str(x.avoid) && h('p', {}, str(x.avoid)));
  const worn = arr(x.worn);
  sec('Worn thin in', worn.length ? h('div', {class:'tags'}, worn.map(c => h('span', {class:'tag'}, c))) : h('p', {}, 'No stock phrases. It hasn\u2019t been worn thin in advertising.'));
  const opp = arr(x.opp);
  sec('Opposites (tap to map)', opp.length && h('div', {class:'tags'}, opp.map(o => h('button', {type:'button', class:'tag', onclick:() => mapPlain(o)}, o))));
}

/* ---------- Render: path ---------- */
function renderTrail() {
  $trail.textContent = '';
  if (state.trail.length < 2) { $trail.append(h('small', {}, 'Your path through words appears here as you map them.')); return; }
  $trail.append(h('small', {}, 'Your path'));
  state.trail.forEach((tr, i) => {
    const snapT = cache.get(tr.key);
    $trail.append(h('span', {}, h('sup', {}, i + 1), h('button', {type:'button', title: snapT && snapT.query.line ? snapT.query.line : null, 'aria-current':String(tr.key === state.currentKey), onclick:() => {
      const snap = cache.get(tr.key); if (snap) loadSnapshot(snap, tr.key);
    }}, tr.w)));
  });
}

function renderAll() { renderHero(); renderControls(); drawField(true); renderTray(); renderDetail(); renderTrail(); }

/* ---------- Wiring ---------- */
function go() {
  const raw = (state.editing ? state.draft : heroText()).trim().replace(/\s+/g, ' ');
  const intent = $i.value.trim();
  const words = raw.match(/[\p{L}'\u2019-]+/gu) || [];
  if (!words.length) { setStatus('Type a word, or paste the line it lives in.'); if (!state.editing) startEdit(true); else { const ta = $hero.querySelector('.heroedit'); if (ta) ta.focus(); } return; }
  if (words.length === 1) { lookup(words[0], '', intent); return; }
  // A line. If it is the line already mapped, remap the same word with the new feeling.
  if (raw.toLowerCase() === (state.query.line || '').toLowerCase() && state.head.w && raw.toLowerCase().includes(state.head.w.toLowerCase())) {
    lookup(state.head.w, raw, intent); return;
  }
  state.pending = raw; state.selected = null; state.editing = false;
  renderHero(); renderDetail(); idleStatus();
  if (window.matchMedia('(max-width: 899px)').matches) $hero.scrollIntoView({block:'start', behavior:'smooth'});
}
$i.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.selected) deselect();
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); startEdit(true); }
});

$i.value = state.query.intent;
renderAll(); idleStatus();
{ const ta = $hero.querySelector('.heroedit'); if (ta) ta.focus({preventScroll:true}); }
initEngine();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!state.editing) renderHero(); else { const ta = $hero.querySelector('.heroedit'); if (ta) ta.dispatchEvent(new Event('input')); } drawField(false); });
})();
</script>
</body>
</html>
